messages:
  no-self-purchase: "&#ff4444You cannot purchase your own item!"
  item-not-available: "&#ff4444Item is no longer available."
  insufficient-funds: "&#ff4444You do not have enough money."
  disabled-item: "&#ff4444You cannot sell that item!"
  max-listings: "&#ff4444You already have {count}/{max} items listed!"
  listing-success: "&#44ff44Item listed for sale at &#ffffff${priceFormatted}&#44ff44!"
  purchase-success: "&fYou bought &a{seller}'s&f {item} &ffor &a${priceFormatted}"
  returned-item: "&#44ff44Your listing has been returned to you."
  inventory-full: "&#ff4444Your inventory is full!"
