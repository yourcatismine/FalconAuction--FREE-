  search-prompt: "&#44ffffPlease type &#ffffffitem name &#44ffffto search."


sounds:
  prev-page: "ITEM_BOOK_PAGE_TURN"
  next-page: "ITEM_BOOK_PAGE_TURN"
  refresh: "UI_TOAST_IN"
  default-button: "UI_BUTTON_CLICK"
  search: "UI_BUTTON_CLICK"
  confirm-sell: "UI_CARTOGRAPHY_TABLE_TAKE_RESULT"
  villager-no: "ENTITY_VILLAGER_NO"
  sale-notify: "ENTITY_EXPERIENCE_ORB_PICKUP"

main-gui:
  title: "{gui-titles}ᴀᴜᴄᴛɪᴏɴ (Page %page%)"

  items-per-page: 45
  sort-colors:
    current: "{accents}"
    not-current: "{secondary}"

  lore-item:
    - "{secondary}Price: {primary}${priceFormatted}"
    - "{secondary}Seller: {primary}{seller}"
    - "{secondary}Time left: {primary}{time}"

  items:
    previous-page:
      material: ARROW
      slot: 45
      display-name: "{primary}ʙᴀᴄᴋ"
      lore:
        - "{secondary}Go to the previous page"

    sort:
      material: CAULDRON
      slot: 47
      display-name: "{primary}ѕᴏʀᴛ"
      lore:
        - "• {mode‐highest}"
        - "• {mode‐lowest}"
        - "• {mode‐lastlisted}"
        - "• {mode‐recentlylisted}"


    search:
      material: OAK_SIGN
      slot: 50
      display-name: "{primary}ѕᴇᴀʀᴄʜ"
      lore:
        - "{secondary}Click to search"

    refresh:
      material: ANVIL
      slot: 49
      display-name: "{primary}ʀᴇꜰʀᴇѕʜ"
      lore:
        - "{secondary}Click to refresh"

    your-items:
      material: CHEST
      slot: 51
      display-name: "{primary}ʏᴏᴜʀ ɪᴛᴇᴍѕ"
      lore:
        - "{secondary}Click to view the items you have listed"

    next-page:
      material: ARROW
      slot: 53
      display-name: "{primary}ɴᴇхᴛ"
      lore:
        - "{secondary}Go to the next page"


sell-confirm-gui:
  title: "{gui-titles}ᴄᴏɴꜰɪʀᴍ ʟɪѕᴛɪɴɢ"

  preview-lore:
    - "{secondary}You're going to sell"
    - "{secondary}this item for {primary}${priceFormatted}"

  decline-button:
    material: RED_STAINED_GLASS_PANE
    slot: 11
    display-name: "&cᴅᴇᴄʟɪɴᴇ"
    lore:
      - "{secondary}Click to cancel the sale"

  confirm-button:
    material: LIME_STAINED_GLASS_PANE
    slot: 15
    display-name: "&aᴄᴏɴꜰɪʀᴍ"
    lore:
      - "{secondary}Click to sell"

purchase-confirm-gui:
  title: "{gui-titles}ᴄᴏɴꜰɪʀᴍ ᴘᴜʀᴄʜᴀѕᴇ"

  decline-button:
    material: RED_STAINED_GLASS_PANE
    slot: 11
    display-name: "&cᴅᴇᴄʟɪɴᴇ"
    lore:
      - "{secondary}Click to cancel purchase"

  confirm-button:
    material: LIME_STAINED_GLASS_PANE
    slot: 15
    display-name: "&aᴄᴏɴꜰɪʀᴍ"
    lore:
      - "{secondary}Click to confirm purchase"


your-items-gui:
  title: "{gui-titles}ʏᴏᴜʀ ɪᴛᴇᴍѕ -> ᴀᴜᴄᴛɪᴏɴ"

  help:
    material: PAPER
    slot: 0
    display-name: "{primary}How to list an item?"
    lore:
      - ""
      - "{secondary}Hold an item and use"
      - "{secondary}Use /ah sell (price)"


  back-button:
    material: RED_STAINED_GLASS_PANE
    slot: 18
    display-name: "&cBack"
    lore:
      - "{secondary}Click to return"

  transactions-button:
    material: WRITABLE_BOOK
    slot: 26
    display-name: "{primary}Transactions"
    lore:
      - "{secondary}Click to see your purchases and sales"


transactions-gui:
  title: "{gui-titles}ᴛʀᴀɴѕᴀᴄᴛɪᴏɴѕ (Page %page%)"

  items-per-page: 45

  lore-sold:
    - "{secondary}{player} bought your {primary}{item} {secondary}for {primary}${amount}"
    - "{secondary}{time-ago} ago"
  lore-bought:
    - "{secondary}You bought {primary}{player}'s {primary}{item} {secondary}for {primary}${amount}"
    - "{secondary}{time-ago} ago"

  stats-button:
    material: BOOK
    slot: 48
    display-name: "{primary}ѕᴛᴀᴛѕ"
    lore:
      - "{secondary}Total spent: {primary}${spent-amount}"
      - "{secondary}Total made: {primary}${made-amount}"

  items:
    previous-page:
      material: ARROW
      slot: 45
      display-name: "{primary}ʙᴀᴄᴋ"
      lore:
        - "{secondary}Go to the previous page"

    search:
      material: OAK_SIGN
      slot: 50
      display-name: "{primary}ѕᴇᴀʀᴄʜ"
      lore:
        - "{secondary}Click to search by name"

    refresh:
      material: WRITABLE_BOOK
      slot: 49
      display-name: "{primary}ᴛʀᴀɴѕᴀᴄᴛɪᴏɴѕ"
      lore:
        - "{secondary}Click to refresh"

    next-page:
      material: ARROW
      slot: 53
      display-name: "{primary}ɴᴇхᴛ"
      lore:
        - "{secondary}Go to the next page"

